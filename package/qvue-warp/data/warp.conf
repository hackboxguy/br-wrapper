# qvue-warpd configuration: the defaults. The daemon reads this file first and
# then the writable layer <state dir>/warp.conf (/data/qvue-warp/warp.conf, or
# ~pi/.config/qvue-warp/warp.conf without /data) on top of it: keys set there
# win. qvue-warpctl on/off/toggle write "enabled" into that layer only.
# "qvue-warpctl reload" or "systemctl reload qvue-warpd" (SIGHUP) re-reads both.

# warp on/off. Off: the daemon holds no DRM resources and fb0 goes 1:1 to HDMI.
enabled = true

# Catmull-Rom steps per calibration grid cell (8: 161x65 vertices per panel)
subdiv = 8

# SCHED_FIFO priority of the render loop while the warp is on (0 = normal)
rt_priority = 10

# seconds between frame statistics lines in the journal (0 = off)
stats_interval = 60

# Per panel (panel1 = HDMI columns 0-1499, panel2 = 1500-2999, panel3 = 3000-4499):
#   panelN.calib   = calibration file (default <datadir>/3xqvue-panelN-21x9.txt)
#   panelN.reverse = true for files that list the points bottom-right first (CES25)
#   panelN.flip_x / panelN.flip_y = mirror the source inside the panel
#   panelN.src     = x y w h: source rectangle in fb0 pixels mapped onto the grid
#                    (default: the panel's own 1500x298 area)
#panel1.flip_x = false
#panel1.flip_y = false
#panel1.src = 0 0 1500 298
#panel2.src = 1500 0 1500 298
#panel3.src = 3000 0 1500 298

# fb0 is blitted into tiled GPU textures every frame and sampled from there.
# Sampling the raster fb0 directly costs ~11 ms GPU per frame and drops ~0.4%
# of the frames; the copy costs ~3 ms and dropped 1 frame in 10800 (2026-11-18).
copy_source = true

# Keep one finished frame queued: +1 frame latency, two frame times for the
# GPU. Made no difference in tests; off.
pipeline = false
