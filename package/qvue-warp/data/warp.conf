# qvue-warpd configuration: the defaults. The daemon reads this file first and
# then the writable layer <state dir>/warp.conf (/data/qvue-warp/warp.conf, or
# ~pi/.config/qvue-warp/warp.conf without /data) on top of it: keys set there
# win. qvue-warpctl on/off/toggle write "enabled", qvue-warpctl mirror writes
# "mirror_x"/"mirror_y" into that layer only.
# "qvue-warpctl reload" or "systemctl reload qvue-warpd" (SIGHUP) re-reads both.

# warp on/off. Off: the daemon holds no DRM resources and fb0 goes 1:1 to HDMI.
enabled = true

# Mirror the whole picture, for a reflection that needs it (changed live with
# "qvue-warpctl mirror x|y on|off|toggle", "mirror off", or the Stream Deck's
# Mirror H / Mirror V keys, which save it here):
#   mirror_x: left-right across the whole 4500 px canvas. The panel order is
#             reversed and each panel flipped: panel 1 shows source panel 3
#             right to left, a true mirror image of a full-width picture.
#   mirror_y: top-bottom.
# The source canvas is mirrored first; the per-panel keys below (src, flip_x,
# flip_y) then apply to the mirrored canvas, as they do without a mirror. The
# calibration and the trim stay with the physical panel: only the picture is
# mirrored, and tuning moves the picture as on an unmirrored panel.
# Only the warp mirrors: with the warp off or suspended (Kodi, eglfs apps,
# disp-tester) the picture is not mirrored.
mirror_x = false
mirror_y = false

# Catmull-Rom steps per calibration grid cell (8: 161x65 vertices per panel)
subdiv = 8

# SCHED_FIFO priority of the render loop while the warp is on (0 = normal)
rt_priority = 10

# seconds between frame statistics lines in the journal (0 = off)
stats_interval = 60

# Per panel (panel1 = HDMI columns 0-1499, panel2 = 1500-2999, panel3 = 3000-4499):
#   panelN.calib   = calibration file. Default: the vendor's grid files, read
#                    as they are: <datadir>/3xqvue-vendor-panel1.txt
#                    (panel 1), -panel2.txt (2), -panel3.txt (3).
#                    <datadir>/3xqvue-panelN-21x9.txt is the set recovered from
#                    the rig's test pattern (within ~1 px; set reverse = false
#                    with it).
#   panelN.reverse = the file lists the points bottom-right first (the vendor
#                    files, CES25): true is the default for the vendor files
#   panelN.grid    = WxH of the file's point grid, when neither a "# grid 21x9"
#                    line nor the file name says it (189 points: 21x9 anyway)
#   panelN.calib_flip_x / panelN.calib_flip_y = mirror the calibration's SHAPE
#                    inside the panel: every point's destination x -> 1499-x /
#                    y -> 297-y, each point still belongs to the same source
#                    grid node. Alone it mirrors the whole warped panel (curve
#                    and picture); with mirror_y (or mirror_x) the picture is
#                    mirrored back, so only the curve is flipped. For
#                    when the curve turns out upside down in the reflection.
#                    The trim stays in panel space: tl is still the panel's top
#                    left and an arrow still moves the picture that way.
#                    Different from reverse (which point is which grid node)
#                    and from mirror_x/mirror_y (the picture, not the curve).
#   panelN.flip_x / panelN.flip_y = mirror the source inside the panel
#   panelN.src     = x y w h: source rectangle in fb0 pixels mapped onto the grid
#                    (default: the panel's own 1500x298 area). The vendor files
#                    name an active area of 1450x258; to map only that, centred,
#                    onto the grid (the rest of the panel's fb0 area is then not
#                    shown): panel1.src = 25 20 1450 258, panel2.src = 1525 20
#                    1450 258, panel3.src = 3025 20 1450 258.
# With mirror_x / mirror_y these are canvas coordinates after the mirror:
# panelN.src = x y w h with mirror_x samples fb0 x 4500-x-w .. 4499-x, read
# right to left (flip_x then turns that back to left to right).
#panel1.calib_flip_y = false
#panel1.flip_x = false
#panel1.flip_y = false
#panel1.src = 0 0 1500 298
#panel2.src = 1500 0 1500 298
#panel3.src = 3000 0 1500 298

# fb0 is blitted into tiled GPU textures every frame and sampled from there.
# Sampling the raster fb0 directly costs ~11 ms GPU per frame and drops ~0.4%
# of the frames; the copy costs ~3 ms and dropped 1 frame in 10800 (2026-11-18).
copy_source = true

# Keep one finished frame queued: +1 frame latency, two frame times for the
# GPU. Made no difference in tests; off.
pipeline = false
