# Select the als-dimmer config from the display this head unit actually drives.
#
# A drop-in rather than a forked unit file: als-dimmer's own unit stays whatever
# upstream ships, and this adds exactly the image-specific behaviour. The empty
# ExecStart= is required by systemd to clear the inherited one before setting a
# replacement.
[Service]
ExecStart=
ExecStart=/usr/bin/als-dimmer-select-config.sh
